name: compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout perk-redis
        uses: actions/checkout@v4
        with:
          path: perk-redis
      - name: Read pinned host ref from compatibility manifest
        id: manifest
        working-directory: perk-redis
        run: |
          set -euo pipefail
          ref=$(jq -r '.host.tested_ref' compatibility-manifest.json)
          echo "$ref" | grep -Eq '^[0-9a-f]{40}$'
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Full compatibility check against the pinned host ref
        uses: ./perk-redis/.github/actions/compat-check
        with:
          host_ref: ${{ steps.manifest.outputs.ref }}
